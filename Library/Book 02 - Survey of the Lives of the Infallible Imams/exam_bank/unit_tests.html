<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book 02 — Unit Tests</title><style>body{margin:0;background:#faf8f4;color:#1c1a17;font:16px/1.55 Georgia,serif}.wrap{max-width:900px;margin:auto;padding:24px 16px 60px}.panel,.unit{background:#fff;border:1px solid #e2dcd1;border-radius:10px;padding:17px;margin:12px 0}.controls{display:flex;gap:7px;flex-wrap:wrap}.controls button{padding:8px 10px;border:1px solid #cfc7ba;background:#fff;border-radius:6px;cursor:pointer}.q{padding:12px 0;border-bottom:1px solid #eee}.tag{font:700 10px system-ui;background:#eee4d3;padding:3px 6px;border-radius:4px;margin-right:6px}.ans{display:none;background:#fdf3dc;padding:10px;border-radius:7px;margin-top:8px}.show .ans{display:block}.muted{color:#6b6459}</style></head><body><div class="wrap"><h1>Book 02 — Unit Tests</h1><p class="muted">Every reading unit has its own test. Questions come from the same master universe used by cumulative/full-book exams.</p><div id="controls" class="panel"></div><div id="test"></div></div><script>let DATA=null,units=[];async function boot(){DATA=await fetch('../exam_bank/questions.json').then(r=>r.json());units=[...new Set(DATA.questions.map(q=>q.unit_id).filter(Boolean))];controls.innerHTML=units.map((u,i)=>'<button onclick="make(\''+u+'\')">Unit '+String(i+1).padStart(2,'0')+'</button>').join('');make(units[0])}function make(uid){let qs=DATA.questions.filter(q=>q.unit_id===uid);let chosen=[...qs.filter(q=>q.type==='MCQ').slice(0,6),...qs.filter(q=>q.type==='FILL').slice(0,4),...qs.filter(q=>q.type==='SHORT').slice(0,5),...qs.filter(q=>q.type==='LONG').slice(0,3)];test.innerHTML='<div class="unit"><h2>'+qs[0].unit_title+'</h2><p class="muted">'+qs.length+' master-bank questions available; this unit test shows '+chosen.length+' mixed questions.</p>'+chosen.map(item).join('')+'</div>'}function item(q){return '<div class="q" onclick="this.classList.toggle(\'show\')"><span class="tag">'+q.type+'</span><b>'+q.prompt+'</b><div class="ans"><b>Answer:</b><br>'+String(q.answer).replace(/\n/g,'<br>')+'<br><small>'+String(q.source_chunk_id||'')+'</small></div></div>'}boot().catch(e=>test.innerHTML='<div class="panel">Could not load question bank: '+e.message+'</div>');</script></body></html>
