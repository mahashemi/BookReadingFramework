<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book 02 — Interleaved Exam Generator</title><style>
body{margin:0;background:#faf8f4;color:#1c1a17;font:16px/1.55 Georgia,serif}.wrap{max-width:900px;margin:auto;padding:22px 16px 60px}.panel,.paper{background:#fff;border:1px solid #e2dcd1;border-radius:10px;padding:18px;margin:14px 0}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls button{padding:8px 12px;border:1px solid #cfc7ba;background:#fff;border-radius:6px;cursor:pointer}.meta{color:#6b6459}.q{margin:18px 0;padding-left:12px;border-left:3px solid #8b6f3e}.tag{font:700 11px system-ui;background:#eee4d3;padding:3px 6px;border-radius:4px}.answer{display:none;background:#fdf3dc;padding:10px;border-radius:7px;margin-top:7px}.q.show .answer{display:block}.showbtn{margin-top:6px;padding:5px 9px}.paper h2{margin-top:0}.paper ol{padding-left:25px}</style></head><body><div class="wrap"><h1>Book 02 — Interleaved Exam Generator</h1><p class="meta" id="metaline">Loading master question universe…</p><div class="panel"><b>Exam model</b><p>Default simulated paper: <b>4 objective questions</b> (MCQ/FILL) + <b>7 written questions</b> (SHORT/LONG). This is a preparation model, not a claim about any particular future paper.</p><div class="controls"><button onclick="make(1)">Simulated Year 1</button><button onclick="make(2)">Year 2</button><button onclick="make(3)">Year 3</button><button onclick="make(10)">Year 10</button><button onclick="make(20)">Year 20</button><button onclick="hard()">Hard / Worst-case</button><button onclick="window.print()">Print</button></div></div><div id="paper">Loading…</div></div><script>
let DATA=[];
async function boot(){
  const res=await fetch('../exam_bank/questions.json').then(r=>r.json());
  DATA=res.questions;
  document.getElementById('metaline').textContent='Master universe: '+DATA.length+' questions · mixed reading units · source-traceable question IDs.';
  make(1);
}
function rng(seed){let x=seed||1;return()=>{x=(x*1664525+1013904223)>>>0;return x/4294967296}}
function pick(arr,n,seed){let a=[...arr],r=rng(seed),out=[];while(a.length&&out.length<n){let i=Math.floor(r()*a.length);out.push(a.splice(i,1)[0])}return out}
function render(title,obj,written){paper.innerHTML='<div class="paper"><h2>'+title+'</h2><p class="meta">Questions are drawn from the same master universe; units are interleaved.</p><h3>Part A — Objective ('+obj.length+')</h3><ol>'+obj.map(q=>item(q)).join('')+'</ol><h3>Part B — Written ('+written.length+')</h3><ol>'+written.map(q=>item(q)).join('')+'</ol></div>'}
function item(q){return '<li class="q" onclick="this.classList.toggle(\'show\')"><span class="tag">'+q.type+'</span> <b>'+q.prompt+'</b><button class="showbtn" onclick="event.stopPropagation();this.parentElement.classList.add(\'show\')">Show answer</button><div class="answer"><b>Answer:</b><br>'+String(q.answer).replace(/\n/g,'<br>')+'<br><small>'+q.unit_title+'</small></div></li>'}
function make(year){let obj=pick(DATA.filter(q=>q.type==='MCQ'||q.type==='FILL'),4,100+year),w=pick(DATA.filter(q=>q.type==='SHORT'||q.type==='LONG'),7,500+year);render('Simulated Year '+year,obj,w)}
function hard(){let hardQs=DATA.filter(q=>q.difficulty==='hard'),written=pick(DATA.filter(q=>q.type==='LONG'||q.type==='SHORT'),11,999);render('Hard / Worst-case Paper',pick(DATA.filter(q=>q.type==='MCQ'||q.type==='FILL'),4,777),[...pick(hardQs,6,888),...pick(written,5,889)].slice(0,11))}
boot().catch(e=>{document.getElementById('metaline').textContent='Could not load question bank: '+e.message;paper.innerHTML=''});
</script></body></html>
