<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book 02 — Practice Exam Generator</title><style>body{margin:0;background:#faf8f4;color:#1c1a17;font:16px/1.55 Georgia,serif}.wrap{max-width:920px;margin:auto;padding:22px 16px 60px}.panel,.paper{background:#fff;border:1px solid #e2dcd1;border-radius:10px;padding:18px;margin:14px 0}.controls{display:flex;gap:7px;flex-wrap:wrap}.controls button{padding:8px 11px;border:1px solid #cfc7ba;background:#fff;border-radius:6px;cursor:pointer}.meta{color:#6b6459}.q{margin:14px 0;padding:10px 0 10px 12px;border-left:3px solid #8b6f3e}.ans{display:none;background:#fdf3dc;padding:10px;border-radius:7px;margin-top:7px}.q.show .ans{display:block}.showbtn{margin-top:7px;padding:5px 9px}</style></head><body><div class="wrap"><h1>Book 02 — Practice Exam Generator</h1><div class="panel"><p class="meta">One master universe; many interleaved papers. Default paper = 4 objective + 7 written.</p><div class="controls"><button onclick="paper('unit')">Unit Test</button><button onclick="paper('three')">3-Unit Test</button><button onclick="paper('half')">Half-book Test</button><button onclick="paper('full')">Full-book Test</button><button onclick="paper('year1')">Year 1</button><button onclick="paper('year10')">Year 10</button><button onclick="paper('year20')">Year 20</button><button onclick="paper('hard')">Hard / Worst-case</button><button onclick="window.print()">Print</button></div></div><div id="out"></div></div><script>let Q=[];function rand(seed){let x=seed>>>0;return()=>{x=(x*1664525+1013904223)>>>0;return x/4294967296}}function sample(arr,n,seed){let a=[...arr],r=rand(seed),o=[];while(a.length&&o.length<n)o.push(a.splice(Math.floor(r()*a.length),1)[0]);return o}function item(q){return '<div class="q" onclick="this.classList.toggle(\'show\')"><b>'+q.prompt+'</b><button class="showbtn" onclick="event.stopPropagation();this.parentElement.classList.add(\'show\')">Show answer</button><div class="ans"><b>Answer:</b><br>'+String(q.answer).replace(/\n/g,'<br>')+'<br><small>'+q.unit_title+'</small></div></div>'}function render(title,o,w){out.innerHTML='<div class="paper"><h2>'+title+'</h2><p class="meta">'+o.length+' objective + '+w.length+' written · interleaved across reading units.</p><h3>Part A — Objective</h3>'+o.map(item).join('')+'<h3>Part B — Written</h3>'+w.map(item).join('')+'</div>'}function bySkill(pool,skills,n,seed){let out=[],used=new Set();for(let i=0;i<skills.length&&out.length<n;i++){let a=pool.filter(q=>q.skill===skills[i]&&!used.has(q.id));if(a.length){let x=sample(a,1,seed+i*997)[0];out.push(x);used.add(x.id)}}let rest=pool.filter(q=>!used.has(q.id));return out.concat(sample(rest,Math.max(0,n-out.length),seed+7777))}function make(seed,on=4,wn=7,pool=Q){let obj=sample(pool.filter(q=>q.type==='MCQ'||q.type==='FILL'),on,seed);let skills=['comprehension','reasoning','evidence','connection','listener_challenge','synthesis'];let w=bySkill(pool.filter(q=>q.type==='SHORT'||q.type==='LONG'),skills,wn,seed+10000);return [obj,w]}function paper(kind){if(!Q.length)return;if(kind.startsWith('year')){let y=+kind.slice(4),[o,w]=make(1000+y);render('Simulated Year '+y,o,w);return}if(kind==='hard'){let o=sample(Q.filter(q=>(q.type==='MCQ'||q.type==='FILL')&&q.difficulty==='hard'),4,700),w=sample(Q.filter(q=>(q.type==='LONG'||q.type==='SHORT')&&q.difficulty==='hard'),7,800);render('Hard / Worst-case Paper',o,w);return}if(kind==='full'){let [o,w]=make(2000,8,18);render('Full-book Master Practice',o,w);return}if(kind==='half'){let ids=[...new Set(Q.map(q=>q.unit_id))].slice(0,7),pool=Q.filter(q=>ids.includes(q.unit_id));let [o,w]=make(3000,6,12,pool);render('Half-book Test — Units 1–7',o,w);return}if(kind==='three'){let ids=[...new Set(Q.map(q=>q.unit_id))].slice(0,3),pool=Q.filter(q=>ids.includes(q.unit_id));let [o,w]=make(5000,4,7,pool);render('3-Unit Interleaved Test',o,w);return}let id=[...new Set(Q.map(q=>q.unit_id))][0],pool=Q.filter(q=>q.unit_id===id),[o,w]=make(1,4,7,pool);render('Unit Test — '+pool[0].unit_title,o,w)}fetch('questions.json').then(r=>r.json()).then(d=>{Q=d.questions;paper('year1')}).catch(e=>out.innerHTML='<div class="panel">Could not load question bank: '+e.message+'<br>Serve through GitHub Pages or a local web server.</div>');</script></body></html>
