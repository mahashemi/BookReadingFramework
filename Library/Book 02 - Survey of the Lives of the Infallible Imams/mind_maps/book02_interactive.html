<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book 02 - Interactive Concept DAG</title>
<style>:root{--bg:#faf8f4;--card:#fff;--ink:#1c1a17;--muted:#6b6459;--line:#d9d0c2;--a:#8b6f3e;--b:#3d5a4c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui;overflow:hidden}.top{position:fixed;z-index:5;top:0;left:0;right:0;background:var(--card);border-bottom:1px solid var(--line);padding:10px}.controls{display:flex;gap:6px;flex-wrap:wrap}.controls button,.controls input{padding:6px 9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px}.controls input{min-width:220px}.hint{color:var(--muted);font-size:12px;margin-bottom:6px}#canvas{position:absolute;inset:72px 0 0;background:linear-gradient(to right,#8b6f3e08 1px,transparent 1px) 0 0/40px 40px,linear-gradient(to bottom,#8b6f3e08 1px,transparent 1px) 0 0/40px 40px;overflow:hidden}#world{position:absolute;width:2400px;height:1600px;transform-origin:0 0}svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.edge{stroke:var(--b);stroke-width:2;fill:none;opacity:.65}.node{position:absolute;width:210px;min-height:70px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 3px 10px #0000000d;cursor:pointer}.node:hover{border-color:var(--b)}.node.sel{outline:2px solid var(--b)}.root{width:250px;border:2px solid var(--a);background:#fdf3dc}.unit{border-left:4px solid var(--a)}.concept{border-left:4px solid var(--b)}.term{border-left:4px solid #888}.evidence{border-left:4px solid #b06d43}.kind{font-size:9px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em}.name{font-weight:700;margin-top:2px}.desc{font-size:11px;color:var(--muted);margin-top:4px}.badge{display:inline-block;margin-top:6px;background:#fdf3dc;padding:2px 5px;border-radius:4px;font-size:10px}#info{position:fixed;left:10px;bottom:10px;z-index:6;max-width:390px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px;font-size:12px}</style>
</head><body><div class="top"><div class="hint"><b>Interactive concept DAG:</b> click a rectangle to reveal its children. Click the new rectangles to keep growing the graph. Connections are directed.</div><div class="controls"><input id="search" placeholder="Search visible nodes" oninput="filterNodes()"><button onclick="resetGraph()">Reset</button><button onclick="fit()">Fit</button><button onclick="expandAll()">Expand all levels</button></div></div><div id="canvas"><div id="world"><svg id="svg"></svg><div id="nodes"></div></div></div><div id="info">Select a node.</div>
<script>
let D=null,N={},E=[],open=new Set(),selected="book",scale=1,px=0,py=0;
const rootId="book";
function esc(s){return String(s||"").replace(/[&<>]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[m]})}
function add(id,type,name,desc,parent,meta){if(!N[id])N[id]={id:id,type:type,name:name,desc:desc,parent:parent,meta:meta||{},x:0,y:0};if(parent)E.push([parent,id])}
function init(){add(rootId,"root",D.title,"13 reading units - click to begin",null,{});D.units.forEach(function(u,i){add(u.id,"unit",u.title,u.concepts.length+" concepts",rootId,{unit:i})});layout();render()}
function kids(id){return E.filter(function(e){return e[0]===id}).map(function(e){return e[1]})}
function openNode(id){var n=N[id];if(!n)return;if(open.has(id)){open.delete(id);prune(id);layout();render();return}open.add(id);if(n.type==="unit")unitKids(n);else if(n.type==="concept")conceptKids(n);else if(n.type==="term")termKids(n);else if(n.type==="evidence")evidenceKids(n);layout();render();select(id)}
function unitKids(n){var u=D.units[n.meta.unit];u.concepts.slice(0,4).forEach(function(c,i){var id=n.id+"-c"+i;add(id,"concept",c.title,c.explanation,n.id,{unit:n.meta.unit,index:i,concept:c})})}
function conceptKids(n){var u=D.units[n.meta.unit],i=n.meta.index,c=n.meta.concept;var list=[];if(u.terms[i])list.push(["term",u.terms[i].term,u.terms[i].gloss,i]);if(u.claim_examples[i])list.push(["evidence","Evidence / example",u.claim_examples[i].evidence||u.claim_examples[i].reasoning,i]);if(u.concepts[i+1])list.push(["concept",u.concepts[i+1].title,u.concepts[i+1].explanation,i+1]);if(u.concepts[i-1])list.push(["concept",u.concepts[i-1].title,u.concepts[i-1].explanation,i-1]);list.slice(0,4).forEach(function(x,k){var id=n.id+"-r"+k;add(id,x[0],x[1],x[2],n.id,{unit:n.meta.unit,index:x[3],concept:x[0]==="concept"?u.concepts[x[3]]:null,term:x[0]==="term"?u.terms[x[3]]:null,claim:x[0]==="evidence"?u.claim_examples[x[3]]:null})})}
function termKids(n){var u=D.units[n.meta.unit],i=n.meta.index;var list=[];if(u.terms[i+1])list.push(["term",u.terms[i+1].term,u.terms[i+1].gloss,i+1]);if(u.terms[i-1])list.push(["term",u.terms[i-1].term,u.terms[i-1].gloss,i-1]);(u.connections||[]).slice(0,2).forEach(function(c,k){var t=D.units.find(function(x){return x.id===c.to_unit_id});if(t)list.push(["unit",t.title,c.label,null])});list.forEach(function(x,k){var id=n.id+"-t"+k;add(id,x[0],x[1],x[2],n.id,{unit:x[0]==="unit"?x[1]:n.meta.unit,index:x[3]})})}
function evidenceKids(n){var u=D.units[n.meta.unit];(u.connections||[]).slice(0,3).forEach(function(c,k){var t=D.units.find(function(x){return x.id===c.to_unit_id});if(t){var id=n.id+"-u"+k;add(id,"unit",t.title,c.label,n.id,{unit:t.id})}})}
function prune(id){var todo=kids(id).slice(),gone=[];while(todo.length){var x=todo.shift();gone.push(x);todo=todo.concat(kids(x))}gone.forEach(function(x){delete N[x]});E=E.filter(function(e){return gone.indexOf(e[1])<0&&gone.indexOf(e[0])<0});}
function visible(){var v={book:true},change=true;while(change){change=false;E.forEach(function(e){if(v[e[0]]&&open.has(e[0])&&!v[e[1]]){v[e[1]]=true;change=true}})}return Object.keys(v).filter(function(id){return N[id]})}
function layout(){var ids=visible(),lev={book:0},q=["book"];while(q.length){var x=q.shift();kids(x).forEach(function(ch){if(!lev[ch]){lev[ch]=lev[x]+1;q.push(ch)}})}var L={};ids.forEach(function(id){var z=lev[id]||0;(L[z]||(L[z]=[])).push(id)});Object.keys(L).forEach(function(k){var a=L[k],w=210,g=35,start=(2400-(a.length*w+(a.length-1)*g))/2;a.forEach(function(id,i){N[id].x=Math.max(10,start+i*(w+g));N[id].y=40+Number(k)*170})})}
function render(){nodes.innerHTML="";svg.innerHTML="";visible().forEach(function(id){kids(id).forEach(function(ch){if(N[ch]&&N[ch].x>=0&&visible().indexOf(ch)>=0)edge(N[id],N[ch])})});visible().forEach(function(id){var n=N[id],el=document.createElement("div");el.id="n-"+id.replace(/[^a-zA-Z0-9_-]/g,"_");el.className="node "+(n.type||"")+" "+(selected===id?"sel":"");el.style.left=n.x+"px";el.style.top=n.y+"px";el.innerHTML="<div class="kind">"+esc(n.type)+"</div><div class="name">"+esc(n.name)+"</div><div class="desc">"+esc(n.desc).slice(0,220)+"</div>"+(n.type==="unit"?"<span class="badge">click: open concepts</span>":n.type==="concept"?"<span class="badge">click: open related ideas</span>":n.type==="term"?"<span class="badge">click: open related terms</span>":"");el.onclick=function(){openNode(id)};nodes.appendChild(el)})}
function edge(a,b){var p=document.createElementNS("http://www.w3.org/2000/svg","path"),x1=a.x+105,y1=a.y+70,x2=b.x+105,y2=b.y,d="M"+x1+" "+y1+" C"+x1+" "+((y1+y2)/2)+" "+x2+" "+((y1+y2)/2)+" "+x2+" "+y2;p.setAttribute("d",d);p.setAttribute("class","edge");svg.appendChild(p)}
function select(id){selected=id;info.innerHTML="<b>"+esc(N[id].name)+"</b><div class="desc">"+esc(N[id].desc)+"</div><div class="desc">Click again to expand/collapse.</div>";render()}
function resetGraph(){N={};E=[];open.clear();selected="book";init();fit()}
function expandAll(){var again=true,guard=0;while(again&&guard<10){again=false;guard++;visible().forEach(function(id){if(!open.has(id)&&N[id].type!=="term"&&N[id].type!=="evidence"){openNode(id);again=true}})}fit()}
function filterNodes(){var q=search.value.toLowerCase();document.querySelectorAll(".node").forEach(function(el){el.style.opacity=!q||el.textContent.toLowerCase().indexOf(q)>=0?"1":".2"})}
function fit(){var ids=visible(),minx=Math.min.apply(null,ids.map(function(id){return N[id].x})),maxx=Math.max.apply(null,ids.map(function(id){return N[id].x+210})),miny=Math.min.apply(null,ids.map(function(id){return N[id].y})),maxy=Math.max.apply(null,ids.map(function(id){return N[id].y+80}));var cw=innerWidth,ch=innerHeight-72;scale=Math.min(cw/(maxx-minx+80),ch/(maxy-miny+80),1);px=(cw-(maxx-minx)*scale)/2-minx*scale;py=(ch-(maxy-miny)*scale)/2-miny*scale;world.style.transform="translate("+px+"px,"+py+"px) scale("+scale+")"}
canvas.addEventListener("wheel",function(e){e.preventDefault();scale=Math.max(.4,Math.min(1.8,scale*(e.deltaY<0?1.08:.92)));world.style.transform="translate("+px+"px,"+py+"px) scale("+scale+")"},{passive:false});
(async function(){try{D=await fetch("../data/study_book02.json").then(function(r){return r.json()});init();fit()}catch(e){info.innerHTML="<b>Could not load study data.</b> "+esc(e.message)}})();
</script></body></html>
