name: Tests

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "add-**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Framework tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: npm test
