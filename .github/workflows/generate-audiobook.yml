name: Generate chapter audio

on:
  pull_request:
    branches: [main]
    paths:
      - 'audio/**'
      - 'scripts/generate_audiobook.py'
      - '.github/workflows/generate-audiobook.yml'
  workflow_dispatch:
    inputs:
      book_id:
        description: 'Manifest book ID (for example book02 or book03)'
        required: false
        type: string
        default: 'book02'

permissions:
  actions: write
  contents: read

concurrency:
  group: chapter-audio-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  generate-audio:
    name: Generate chapter MP3s
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cancel stale audio runs for this branch
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run_id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --jq ".workflow_runs[] | select(.head_branch == \"$GITHUB_HEAD_REF\" and .name == \"Generate chapter audio\" and .status == \"in_progress\") | .id"); do
            if [ "$run_id" != "$GITHUB_RUN_ID" ]; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" || true
            fi
          done
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Edge TTS
        run: python -m pip install --upgrade edge-tts
      - name: Generate declared chapter audio
        env:
          BOOK_ID: ${{ github.event.inputs.book_id }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python scripts/generate_audiobook.py --book book01 --book book02 --output-dir dist/audiobook
          elif [ -n "$BOOK_ID" ]; then
            python scripts/generate_audiobook.py --book "$BOOK_ID" --output-dir dist/audiobook
          else
            python scripts/generate_audiobook.py --output-dir dist/audiobook
          fi
      - name: Upload MP3s as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: chapter-audiobook-mp3
          path: dist/audiobook/
          if-no-files-found: error
          retention-days: 30
